<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steve's Rodeo - Audio Player</title>
    <!-- LiveKit client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #111; color: #eee; padding: 20px; }
        h1 { color: #e8a020; margin-bottom: 5px; }
        .subtitle { color: #888; margin-bottom: 25px; font-size: 0.9em; }
        .auth-box { background: #1a1a1a; padding: 20px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #333; }
        .auth-box h2 { color: #e8a020; margin-bottom: 15px; }
        .row { display: flex; gap: 10px; align-items: center; }
        input { flex: 1; padding: 10px 14px; background: #222; border: 1px solid #444; border-radius: 6px; color: #eee; font-size: 0.95em; }
        input:focus { outline: none; border-color: #e8a020; }
        .btn { padding: 10px 22px; background: #e8a020; color: #111; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.95em; white-space: nowrap; }
        .btn:hover { background: #f5b030; }
        .btn.stop { background: #c0392b; color: white; }
        .btn.stop:hover { background: #e74c3c; }
        .status { padding: 10px 14px; border-radius: 6px; margin: 12px 0; font-weight: 500; font-size: 0.9em; }
        .success { background: #1a3a1a; color: #4caf50; border: 1px solid #2d5a2d; }
        .error { background: #3a1a1a; color: #f44336; border: 1px solid #5a2d2d; }
        .loading { background: #1a2a3a; color: #42a5f5; border: 1px solid #2d3f5a; }
        .games-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .games-header h2 { color: #e8a020; }
        .badge { background: #e8a020; color: #111; padding: 3px 10px; border-radius: 12px; font-size: 0.8em; font-weight: bold; }
        .live-badge { background: #c0392b; color: white; padding: 3px 10px; border-radius: 12px; font-size: 0.8em; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .card { background: #1a1a1a; padding: 16px; border-radius: 8px; border: 2px solid #2a2a2a; transition: border-color 0.2s; }
        .card:hover { border-color: #444; }
        .card.active { border-color: #4caf50; background: #1a2a1a; }
        .card.live { border-color: #e8a020; }
        .card-title { font-weight: bold; color: #fff; margin-bottom: 6px; font-size: 0.95em; }
        .card-meta { font-size: 0.8em; color: #888; margin-bottom: 10px; line-height: 1.6; }
        .card-meta span { display: block; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
        .participants { font-size: 0.8em; color: #888; }
        .active-count { margin-top: 20px; color: #888; font-size: 0.85em; text-align: center; }
    </style>
</head>
<body>
    <h1>🤠 Steve's Rodeo</h1>
    <p class="subtitle">Live sports audio streams</p>

    <div class="auth-box">
        <h2>Login</h2>
        <div id="authStatus"></div>
        <div class="row">
            <input type="text" id="identity" placeholder="Username" value="">
            <input type="password" id="password" placeholder="Password" value="">
            <button class="btn" onclick="login()">Login</button>
        </div>
    </div>

    <div id="channelsSection" style="display:none;">
        <div class="games-header">
            <h2>Live Channels</h2>
            <span class="badge" id="channelCount">0 channels</span>
        </div>
        <div id="status"></div>
        <div class="grid" id="channels"></div>
        <div class="active-count" id="activeCount"></div>
    </div>

    <script>
        const API = window.location.origin;
        let authToken = null;
        let channels = [];
        let activeSessions = new Map(); // channelId -> { room, sessionId, heartbeatInterval }
        let heartbeatIntervals = new Map();

        function setStatus(id, msg, type) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.className = `status ${type}`;
        }

        async function login() {
            try {
                setStatus('authStatus', '🔐 Logging in...', 'loading');
                const identity = document.getElementById('identity').value;
                const password = document.getElementById('password').value;

                const res = await fetch(`${API}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identity, password })
                });

                if (!res.ok) throw new Error('Login failed - check credentials');
                const data = await res.json();
                authToken = data.token;

                setStatus('authStatus', `✅ Logged in as ${identity}`, 'success');
                document.getElementById('channelsSection').style.display = 'block';
                await loadChannels();

            } catch (err) {
                setStatus('authStatus', `❌ ${err.message}`, 'error');
            }
        }

        async function loadChannels() {
            try {
                setStatus('status', '📡 Loading channels...', 'loading');

                const res = await fetch(`${API}/api/channels`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (!res.ok) throw new Error('Failed to load channels');
                channels = await res.json();

                document.getElementById('channelCount').textContent = `${channels.length} channels`;
                setStatus('status', `✅ Found ${channels.length} channels`, 'success');
                renderChannels();

                // Auto-refresh channel list every 30s
                setInterval(loadChannels, 30000);

            } catch (err) {
                setStatus('status', `❌ ${err.message}`, 'error');
            }
        }

        function renderChannels() {
            const container = document.getElementById('channels');
            const active = activeSessions.size;

            container.innerHTML = channels.map(ch => {
                const isActive = activeSessions.has(ch.id);
                const isLive = ch.liveCaller || ch.caller_state === 'phone';
                const startTime = ch.starts_at ? new Date(ch.starts_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

                return `
                    <div class="card ${isActive ? 'active' : ''} ${isLive && !isActive ? 'live' : ''}">
                        <div class="card-title">${ch.display_name}</div>
                        <div class="card-meta">
                            ${ch.description ? `<span>📍 ${ch.description}</span>` : ''}
                            ${ch.caller_name ? `<span>🎙️ ${ch.caller_name}</span>` : ''}
                            ${startTime ? `<span>🕐 ${startTime}</span>` : ''}
                        </div>
                        <div class="card-footer">
                            <span class="participants">👥 ${ch.participantCount || 0} listening</span>
                            ${isLive ? '<span class="live-badge">🔴 LIVE</span>' : ''}
                            <button class="btn ${isActive ? 'stop' : ''}" 
                                onclick="toggleChannel('${ch.id}', '${ch.display_name.replace(/'/g, '')}')">
                                ${isActive ? '⏹ Stop' : '▶ Listen'}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('activeCount').textContent = 
                active > 0 ? `🔊 Listening to ${active} channel${active > 1 ? 's' : ''} simultaneously` : '';
        }

        async function toggleChannel(channelId, channelName) {
            if (activeSessions.has(channelId)) {
                await stopChannel(channelId);
            } else {
                await startChannel(channelId, channelName);
            }
        }

        async function startChannel(channelId, channelName) {
            try {
                setStatus('status', `🎤 Connecting to ${channelName}...`, 'loading');

                // Get LiveKit token
                const res = await fetch(`${API}/api/session/start`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ channel_id: channelId })
                });

                if (!res.ok) throw new Error('Failed to start session');
                const session = await res.json();

                // Connect to LiveKit room
                const room = new LivekitClient.Room({
                    adaptiveStream: true,
                    dynacast: true
                });

                room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, pub, participant) => {
                    if (track.kind === 'audio') {
                        const audioEl = track.attach();
                        audioEl.style.display = 'none';
                        document.body.appendChild(audioEl);
                        audioEl.play().catch(e => console.log('Autoplay blocked:', e));
                    }
                });

                room.on(LivekitClient.RoomEvent.Disconnected, () => {
                    console.log(`Disconnected from ${channelName}`);
                    activeSessions.delete(channelId);
                    renderChannels();
                });

                await room.connect(session.url, session.token);
                console.log(`✅ Connected to ${channelName}`);

                // Start heartbeat every 20s
                const heartbeat = setInterval(async () => {
                    try {
                        await fetch(`${API}/api/session/heartbeat`, {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${authToken}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ session_id: session.session_id })
                        });
                    } catch (e) {
                        console.log('Heartbeat failed');
                    }
                }, 20000);

                activeSessions.set(channelId, {
                    room,
                    sessionId: session.session_id,
                    heartbeat
                });

                setStatus('status', `✅ Connected to ${channelName}`, 'success');
                renderChannels();

            } catch (err) {
                setStatus('status', `❌ ${err.message}`, 'error');
            }
        }

        async function stopChannel(channelId) {
            const session = activeSessions.get(channelId);
            if (!session) return;

            try {
                clearInterval(session.heartbeat);
                await session.room.disconnect();

                await fetch(`${API}/api/session/end`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ session_id: session.sessionId })
                });

                activeSessions.delete(channelId);
                setStatus('status', '✅ Stopped', 'success');
                renderChannels();

            } catch (err) {
                console.error('Stop error:', err);
                activeSessions.delete(channelId);
                renderChannels();
            }
        }
    </script>
</body>
</html>
