<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUB — Sports Audio</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.0/dist/livekit-client.umd.min.js"></script>
<style>
:root {
  --bg:#0e0e0f; --sidebar:#131315; --card:#1a1a1e; --card-hover:#202026;
  --border:#2a2a30; --accent:#00d4ff; --accent-dim:rgba(0,212,255,0.12);
  --green:#22c55e; --green-dim:rgba(34,197,94,0.12); --red:#ef4444;
  --red-dim:rgba(239,68,68,0.12); --amber:#f59e0b;
  --text:#e4e4e7; --muted:#71717a; --mono:'SF Mono','Fira Code','Consolas',monospace;
  --player-h:0px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column;}

/* ── Login ─────────────────────────── */
#loginPage{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:40px;width:360px;}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:32px;}
.login-logo .ring{width:40px;height:40px;border-radius:50%;background:var(--accent-dim);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;}
.login-logo .ring svg{width:18px;height:18px;fill:var(--accent);}
.login-logo h1{font-family:var(--mono);font-size:1.4rem;letter-spacing:3px;}
.login-card label{display:block;font-size:0.7rem;font-family:var(--mono);letter-spacing:1px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;}
.login-card input{width:100%;background:#0e0e0f;border:1px solid var(--border);border-radius:6px;color:var(--text);padding:10px 14px;font-size:0.9rem;margin-bottom:14px;outline:none;transition:border-color .15s;}
.login-card input:focus{border-color:var(--accent);}
.login-card .btn-primary{width:100%;padding:11px;background:var(--accent);color:#000;font-weight:700;font-family:var(--mono);letter-spacing:1px;font-size:0.85rem;border:none;border-radius:6px;cursor:pointer;transition:opacity .15s;}
.login-card .btn-primary:hover{opacity:.85;}
.login-card .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
.login-err{font-size:.82rem;color:var(--red);margin-top:10px;min-height:16px;}

/* ── App shell ─────────────────────── */
#app{display:none;flex:1;min-height:0;flex-direction:row;}

/* ── Sidebar ───────────────────────── */
.sidebar{width:220px;min-width:220px;height:100%;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.sidebar-top{padding:20px 16px 14px;border-bottom:1px solid var(--border);}
.hub-logo{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.hub-logo .ring{width:34px;height:34px;border-radius:50%;background:var(--accent-dim);border:1.5px solid var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hub-logo .ring svg{width:15px;height:15px;fill:var(--accent);}
.hub-logo span{font-family:var(--mono);font-size:1.1rem;letter-spacing:3px;font-weight:700;}
.live-pill{display:none;align-items:center;gap:5px;font-family:var(--mono);font-size:.65rem;letter-spacing:1px;color:var(--green);padding-left:2px;}
.live-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite;}
.live-pill.show{display:flex;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.sidebar-nav{padding:10px 8px;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:.85rem;color:var(--muted);margin-bottom:2px;transition:background .12s,color .12s;user-select:none;}
.nav-item svg{width:16px;height:16px;flex-shrink:0;fill:currentColor;}
.nav-item:hover{background:var(--card);color:var(--text);}
.nav-item.active{background:var(--accent-dim);color:var(--accent);}

.sidebar-bottom{border-top:1px solid var(--border);padding:10px 8px;margin-top:auto;}
.sidebar-action{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:.78rem;color:var(--muted);letter-spacing:.3px;margin-bottom:2px;transition:background .12s,color .12s;}
.sidebar-action svg{width:14px;height:14px;fill:currentColor;}
.sidebar-action:hover{background:var(--card);color:var(--text);}
.sidebar-action.danger:hover{color:var(--red);}

/* ── Main content ──────────────────── */
.main-wrap{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;}
.main{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
.view{display:none;flex-direction:column;height:100%;overflow:hidden;}
.view.active{display:flex;}

.page-header{display:flex;align-items:center;gap:14px;padding:22px 28px 14px;border-bottom:1px solid var(--border);flex-shrink:0;}
.page-title{font-family:var(--mono);font-size:1.3rem;letter-spacing:3px;font-weight:700;}
.avail-badge{font-family:var(--mono);font-size:.68rem;letter-spacing:1px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:4px;}
.avail-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);}
.avail-badge.has-live .avail-dot{background:var(--green);}
.spacer{flex:1;}
.btn-refresh{display:flex;align-items:center;gap:7px;padding:7px 14px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--muted);font-family:var(--mono);font-size:.72rem;letter-spacing:1px;cursor:pointer;transition:all .15s;}
.btn-refresh:hover{border-color:var(--accent);color:var(--accent);}
.btn-refresh svg{width:13px;height:13px;fill:currentColor;}
.btn-refresh.spinning svg{animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

.toolbar{padding:12px 28px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.search-wrap{flex:1;position:relative;}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;fill:var(--muted);pointer-events:none;}
.search-wrap input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:9px 14px 9px 36px;font-size:.88rem;outline:none;transition:border-color .15s;}
.search-wrap input:focus{border-color:var(--accent);}
.search-wrap input::placeholder{color:var(--muted);}
.filter-tabs{display:flex;gap:4px;}
.filter-btn{padding:7px 13px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:var(--mono);font-size:.7rem;letter-spacing:.5px;cursor:pointer;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:5px;}
.filter-btn:hover{border-color:var(--accent);color:var(--accent);}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#000;}
.filter-btn .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.filter-btn.active .dot{background:#000;}

.channels-scroll{flex:1;overflow-y:auto;padding:0 28px 20px;}
.channels-scroll::-webkit-scrollbar{width:4px;}
.channels-scroll::-webkit-scrollbar-track{background:transparent;}
.channels-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.channel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}

.channel-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;transition:border-color .15s,background .15s;display:flex;flex-direction:column;gap:10px;}
.channel-card:hover{border-color:#3a3a42;background:var(--card-hover);}
.channel-card.is-live{border-color:rgba(245,158,11,.3);}
.channel-card.is-active{border-color:var(--green);background:var(--green-dim);}

.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.card-name{font-weight:600;font-size:.9rem;line-height:1.3;flex:1;}
.card-badges{display:flex;gap:5px;flex-shrink:0;}
.badge{font-family:var(--mono);font-size:.6rem;letter-spacing:.5px;padding:2px 7px;border-radius:3px;font-weight:700;}
.badge-live{background:rgba(245,158,11,.15);color:var(--amber);border:1px solid rgba(245,158,11,.3);}
.badge-active{background:var(--green-dim);color:var(--green);border:1px solid rgba(34,197,94,.3);}
.badge-audio{background:var(--accent-dim);color:var(--accent);border:1px solid rgba(0,212,255,.2);}

.card-meta{font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:4px;}
.meta-row{display:flex;align-items:center;gap:6px;}
.meta-row svg{width:11px;height:11px;fill:currentColor;flex-shrink:0;}
.card-footer{display:flex;align-items:center;justify-content:space-between;}
.participants{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:5px;}
.participants svg{width:12px;height:12px;fill:currentColor;}

.btn-listen{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:5px;border:none;font-family:var(--mono);font-size:.72rem;letter-spacing:.5px;font-weight:700;cursor:pointer;transition:all .15s;}
.btn-listen.listen{background:var(--accent-dim);color:var(--accent);border:1px solid rgba(0,212,255,.3);}
.btn-listen.listen:hover{background:var(--accent);color:#000;}
.btn-listen.stop{background:var(--red-dim);color:var(--red);border:1px solid rgba(239,68,68,.3);}
.btn-listen.stop:hover{background:var(--red);color:#fff;}
.btn-listen svg{width:11px;height:11px;fill:currentColor;}
.btn-listen:disabled{opacity:.4;cursor:not-allowed;}

.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;color:var(--muted);text-align:center;}
.empty-state svg{width:48px;height:48px;margin-bottom:16px;opacity:.3;fill:currentColor;}
.empty-state h3{font-family:var(--mono);letter-spacing:2px;font-size:.9rem;margin-bottom:8px;}
.empty-state p{font-size:.82rem;line-height:1.6;max-width:360px;}

/* ── Schedule ──────────────────────── */
.schedule-list{flex:1;overflow-y:auto;padding:14px 28px 28px;}
.schedule-day{font-family:var(--mono);font-size:.65rem;letter-spacing:2px;color:var(--muted);margin-bottom:8px;margin-top:18px;}
.schedule-day:first-child{margin-top:0;}
.schedule-row{display:flex;align-items:center;gap:14px;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:7px;margin-bottom:5px;}
.schedule-time{font-family:var(--mono);font-size:.78rem;color:var(--muted);min-width:58px;}
.schedule-name{flex:1;font-size:.87rem;}
.schedule-caller{font-size:.77rem;color:var(--muted);}

/* ── Player bar ────────────────────── */
#playerBar{
  flex-shrink:0;background:var(--sidebar);border-top:1px solid var(--border);
  display:none;flex-direction:column;max-height:300px;
}
#playerBar.show{display:flex;}

.player-header{
  display:flex;align-items:center;gap:12px;padding:11px 20px;
  border-bottom:1px solid var(--border);flex-shrink:0;cursor:pointer;
  user-select:none;
}
.player-title{font-family:var(--mono);font-size:.82rem;font-weight:700;letter-spacing:1px;}
.player-count{font-size:.78rem;color:var(--muted);}
.player-header .spacer{flex:1;}
.player-hbtn{
  display:flex;align-items:center;gap:6px;padding:5px 12px;
  border-radius:20px;border:1px solid var(--border);background:transparent;
  color:var(--muted);font-size:.75rem;cursor:pointer;transition:all .15s;
  font-family:var(--mono);
}
.player-hbtn:hover{border-color:var(--accent);color:var(--accent);}
.player-hbtn svg{width:12px;height:12px;fill:currentColor;}
.chevron{transition:transform .2s;fill:var(--muted);}
.player-header.collapsed .chevron{transform:rotate(-90deg);}

.player-rows{overflow-y:auto;flex:1;}
.player-rows::-webkit-scrollbar{width:3px;}
.player-rows::-webkit-scrollbar-thumb{background:var(--border);}

.player-row{
  display:flex;align-items:center;gap:14px;padding:11px 20px;
  border-bottom:1px solid var(--border);
}
.player-row:last-child{border-bottom:none;}

.mute-btn{
  padding:6px 14px;border-radius:20px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-family:var(--mono);
  font-size:.72rem;cursor:pointer;transition:all .15s;white-space:nowrap;
  min-width:76px;text-align:center;
}
.mute-btn:hover{border-color:var(--accent);color:var(--accent);}
.mute-btn.muted{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}

.player-info{flex:1;min-width:0;}
.player-name{font-size:.85rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.player-sub{display:flex;align-items:center;gap:6px;margin-top:3px;}
.status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.status-dot.live{background:var(--green);}
.status-dot.offline{background:var(--red);}
.player-caller{font-size:.75rem;color:var(--muted);}
.status-label{font-size:.7rem;font-family:var(--mono);letter-spacing:.5px;}
.status-label.live{color:var(--green);}
.status-label.offline{color:var(--red);}

/* Volume slider */
.vol-wrap{width:120px;display:flex;align-items:center;gap:8px;}
.vol-wrap svg{width:13px;height:13px;fill:var(--muted);flex-shrink:0;}
input[type=range].vol{
  -webkit-appearance:none;appearance:none;width:100%;height:4px;
  background:var(--border);border-radius:2px;outline:none;cursor:pointer;
}
input[type=range].vol::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--green);cursor:pointer;
}
input[type=range].vol::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;background:var(--green);cursor:pointer;border:none;
}

.stop-btn{
  background:none;border:none;cursor:pointer;color:var(--muted);
  display:flex;padding:4px;border-radius:4px;transition:color .15s;
}
.stop-btn:hover{color:var(--red);}
.stop-btn svg{width:14px;height:14px;fill:currentColor;}

/* ── Modal ─────────────────────────── */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:28px;width:340px;}
.modal-card h3{font-family:var(--mono);letter-spacing:2px;font-size:.9rem;margin-bottom:20px;}
.modal-card label{display:block;font-size:.7rem;font-family:var(--mono);letter-spacing:1px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;}
.modal-card input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:9px 12px;font-size:.88rem;margin-bottom:14px;outline:none;}
.modal-card input:focus{border-color:var(--accent);}
.modal-actions{display:flex;gap:8px;margin-top:4px;}
.modal-actions button{flex:1;padding:9px;border-radius:5px;font-family:var(--mono);font-size:.75rem;letter-spacing:.5px;font-weight:700;cursor:pointer;border:none;}
.btn-cancel{background:var(--border);color:var(--muted);}
.btn-cancel:hover{color:var(--text);}
.btn-save{background:var(--accent);color:#000;}
.btn-save:hover{opacity:.85;}
.modal-msg{font-size:.8rem;margin-top:10px;min-height:16px;}
.modal-msg.ok{color:var(--green);}
.modal-msg.err{color:var(--red);}

/* ── Toast ─────────────────────────── */
#toast{position:fixed;bottom:24px;right:24px;z-index:300;background:var(--card);border:1px solid var(--border);border-radius:7px;padding:11px 16px;font-size:.84rem;display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;max-width:280px;}
#toast.show{opacity:1;transform:translateY(0);}
#toast .tdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
</style>
</head>
<body>

<!-- Login -->
<div id="loginPage">
  <div class="login-card">
    <div class="login-logo">
      <div class="ring"><svg viewBox="0 0 24 24"><path d="M12 3C7 3 3 7 3 12v5a2 2 0 002 2h1a2 2 0 002-2v-3a2 2 0 00-2-2H5v-1a7 7 0 0114 0v1h-1a2 2 0 00-2 2v3a2 2 0 002 2h1a2 2 0 002-2v-5c0-5-4-9-9-9z"/></svg></div>
      <h1>HUB</h1>
    </div>
    <label for="lu">Username</label>
    <input id="lu" type="text" autocomplete="username" placeholder="Enter username">
    <label for="lp">Password</label>
    <input id="lp" type="password" autocomplete="current-password" placeholder="Enter password">
    <button class="btn-primary" id="loginBtn" onclick="doLogin()">SIGN IN</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- App -->
<div id="app">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="hub-logo">
        <div class="ring"><svg viewBox="0 0 24 24"><path d="M12 3C7 3 3 7 3 12v5a2 2 0 002 2h1a2 2 0 002-2v-3a2 2 0 00-2-2H5v-1a7 7 0 0114 0v1h-1a2 2 0 00-2 2v3a2 2 0 002 2h1a2 2 0 002-2v-5c0-5-4-9-9-9z"/></svg></div>
        <span>HUB</span>
      </div>
      <div class="live-pill" id="livePill"><div class="dot"></div>LIVE SESSION ACTIVE</div>
    </div>
    <div class="sidebar-nav">
      <div class="nav-item active" onclick="showView('games')" id="nav-games">
        <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>Games
      </div>
      <div class="nav-item" onclick="showView('schedule')" id="nav-schedule">
        <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5C3.9 3 3 3.9 3 5v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM9 10H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zm-8 4H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2z"/></svg>Schedule
      </div>
      <div class="nav-item" onclick="showView('alerts')" id="nav-alerts">
        <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>Alerts
      </div>
    </div>
    <div class="sidebar-bottom">
      <div class="sidebar-action" onclick="openChangePassword()">
        <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        CHANGE PASSWORD
      </div>
      <div class="sidebar-action danger" onclick="signOut()">
        <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
        SIGN OUT
      </div>
    </div>
  </aside>

  <div class="main-wrap">
    <div class="main">
      <!-- Games -->
      <div class="view active" id="view-games">
        <div class="page-header">
          <div>
            <div class="page-title">GAMES</div>
            <div class="avail-badge" id="availBadge"><div class="avail-dot"></div><span id="availText">Loading…</span></div>
          </div>
          <div class="spacer"></div>
          <button class="btn-refresh" id="refreshBtn" onclick="loadChannels(true)">
            <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            REFRESH
          </button>
        </div>
        <div class="toolbar">
          <div class="search-wrap">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="searchInput" placeholder="Search games, hosts or sports…" oninput="renderChannels()">
          </div>
          <div class="filter-tabs">
            <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
            <button class="filter-btn" onclick="setFilter('audio',this)">Audio</button>
            <button class="filter-btn" onclick="setFilter('live',this)"><div class="dot"></div>LIVE ONLY</button>
          </div>
        </div>
        <div class="channels-scroll">
          <div class="channel-grid" id="channelGrid"></div>
          <div class="empty-state" id="emptyState" style="display:none">
            <svg viewBox="0 0 24 24"><path d="M12 3C7 3 3 7 3 12v5a2 2 0 002 2h1a2 2 0 002-2v-3a2 2 0 00-2-2H5v-1a7 7 0 0114 0v1h-1a2 2 0 00-2 2v3a2 2 0 002 2h1a2 2 0 002-2v-5c0-5-4-9-9-9z"/></svg>
            <h3>NO GAMES AVAILABLE</h3>
            <p id="emptyMsg">No channels found. Try refreshing.</p>
          </div>
        </div>
      </div>

      <!-- Schedule -->
      <div class="view" id="view-schedule">
        <div class="page-header">
          <div class="page-title">SCHEDULE</div>
          <div class="spacer"></div>
          <button class="btn-refresh" onclick="loadChannels(true)">
            <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            REFRESH
          </button>
        </div>
        <div class="schedule-list" id="scheduleList"></div>
      </div>

      <!-- Alerts -->
      <div class="view" id="view-alerts">
        <div class="page-header"><div class="page-title">ALERTS</div></div>
        <div class="empty-state">
          <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
          <h3>NO ALERTS</h3>
          <p>Alerts about your streams will appear here.</p>
        </div>
      </div>
    </div>

    <!-- Player bar (shown when ≥1 active session) -->
    <div id="playerBar">
      <div class="player-header" id="playerHeader" onclick="togglePlayer()">
        <svg class="chevron" viewBox="0 0 24 24" width="14" height="14"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
        <span class="player-title">Player</span>
        <span class="player-count" id="playerCount"></span>
        <div class="spacer"></div>
        <button class="player-hbtn" onclick="event.stopPropagation();muteAll()" id="muteAllBtn">Mute all</button>
        <button class="player-hbtn" onclick="event.stopPropagation();popOut()">
          <svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
          Pop out
        </button>
      </div>
      <div class="player-rows" id="playerRows"></div>
    </div>
  </div>
</div>

<!-- Change password modal -->
<div class="modal-overlay" id="cpModal">
  <div class="modal-card">
    <h3>CHANGE PASSWORD</h3>
    <label>Current Password</label>
    <input type="password" id="cpCurrent" placeholder="Current password">
    <label>New Password</label>
    <input type="password" id="cpNew" placeholder="New password">
    <label>Confirm New Password</label>
    <input type="password" id="cpConfirm" placeholder="Confirm new password">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="changePassword()">Save</button>
    </div>
    <div class="modal-msg" id="cpMsg"></div>
  </div>
</div>

<div id="toast"><div class="tdot" id="tdot"></div><span id="tmsg"></span></div>

<script>
const API = window.location.origin;
let authToken = null, currentUser = null;
let channels = [];
// activeSessions: id -> { room, audioCtx, gain, _elements, muted, volume, name, _stopping }
let activeSessions = new Map();
let currentFilter = 'all';
let channelRefreshTimer = null;
let playerCollapsed = false;

// ─── Utilities ────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let _toastTimer;
function showToast(msg, type='info') {
  const t=document.getElementById('toast'), d=document.getElementById('tdot'), m=document.getElementById('tmsg');
  d.style.background = type==='success'?'var(--green)':type==='error'?'var(--red)':'var(--accent)';
  m.textContent = msg;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>t.classList.remove('show'), 3500);
}

// ─── Login ────────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => { if(e.key==='Enter'&&!authToken) doLogin(); });

async function doLogin() {
  const btn=document.getElementById('loginBtn'), err=document.getElementById('loginErr');
  const username=document.getElementById('lu').value.trim(), password=document.getElementById('lp').value;
  err.textContent='';
  if(!username||!password){err.textContent='Enter username and password.';return;}
  btn.disabled=true; btn.textContent='SIGNING IN…';
  try {
    const res=await fetch(`${API}/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||'Login failed');
    authToken=data.token; currentUser=data.username;
    document.getElementById('loginPage').style.display='none';
    document.getElementById('app').style.display='flex';
    await loadChannels();
    channelRefreshTimer=setInterval(loadChannels,30000);
  } catch(e){ err.textContent=e.message; }
  finally{ btn.disabled=false; btn.textContent='SIGN IN'; }
}

function signOut() {
  clearInterval(channelRefreshTimer);
  activeSessions.forEach((_,id)=>stopChannel(id));
  authToken=null; currentUser=null; channels=[];
  document.getElementById('app').style.display='none';
  document.getElementById('loginPage').style.display='flex';
  document.getElementById('loginErr').textContent='';
  document.getElementById('lp').value='';
}

// ─── Navigation ───────────────────────────────────────────────────────────────
function showView(name) {
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.getElementById('nav-'+name).classList.add('active');
  if(name==='schedule') renderSchedule();
}

// ─── Channels ─────────────────────────────────────────────────────────────────
async function loadChannels(manual=false) {
  if(manual){
    const b=document.getElementById('refreshBtn');
    b.classList.add('spinning');
    setTimeout(()=>b.classList.remove('spinning'),700);
  }
  try {
    const res=await fetch(`${API}/api/channels`,{headers:{'Authorization':`Bearer ${authToken}`}});
    if(!res.ok) return;
    channels=await res.json();
    renderChannels(); renderSchedule();
  } catch(e){ if(manual) showToast(e.message,'error'); }
}

function setFilter(f,el) {
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderChannels();
}

function renderChannels() {
  const q=document.getElementById('searchInput').value.toLowerCase();
  let list=channels;

  // Hide games that ended more than 4 hours ago (not live and start time is old)
  const cutoff = Date.now() - 4 * 60 * 60 * 1000;
  list = list.filter(ch => {
    if (ch.liveCaller || ch.caller_state === 'phone') return true;
    if (!ch.starts_at) return true;
    return new Date(ch.starts_at).getTime() > cutoff;
  });

  if(currentFilter==='live') list=list.filter(ch=>ch.liveCaller||ch.caller_state==='phone');
  if(q) list=list.filter(ch=>(ch.display_name||'').toLowerCase().includes(q)||(ch.description||'').toLowerCase().includes(q));

  const liveCount=channels.filter(ch=>ch.liveCaller||ch.caller_state==='phone').length;
  document.getElementById('availText').textContent=`${liveCount} AVAILABLE`;
  document.getElementById('availBadge').classList.toggle('has-live',liveCount>0);

  const grid=document.getElementById('channelGrid'), empty=document.getElementById('emptyState');
  if(!list.length){grid.innerHTML='';empty.style.display='flex';document.getElementById('emptyMsg').textContent=channels.length===0?'No games found. Check back later or hit Refresh.':'No channels match your search.';return;}
  empty.style.display='none';

  // Active first, then live, then sort by starts_at ascending
  list.sort((a,b)=>{
    const score=x=>(activeSessions.has(x.id)?4:0)+((x.liveCaller||x.caller_state==='phone')?2:0);
    const sd=score(b)-score(a);
    if(sd!==0) return sd;
    const ta=a.starts_at?new Date(a.starts_at).getTime():Infinity;
    const tb=b.starts_at?new Date(b.starts_at).getTime():Infinity;
    return ta-tb;
  });

  grid.innerHTML=list.map(ch=>{
    const isActive=activeSessions.has(ch.id);
    const isLive=ch.liveCaller||ch.caller_state==='phone';
    let timeStr='';
    if(ch.starts_at){
      const d=new Date(ch.starts_at);
      const today=new Date();
      const isToday=d.toDateString()===today.toDateString();
      const tmrw=new Date(today); tmrw.setDate(today.getDate()+1);
      const isTomorrow=d.toDateString()===tmrw.toDateString();
      const dayLabel=isToday?'Today':isTomorrow?'Tomorrow':d.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});
      const timePart=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
      timeStr=`${dayLabel} · ${timePart}`;
    }
    return `<div class="channel-card ${isActive?'is-active':''} ${isLive&&!isActive?'is-live':''}">
      <div class="card-top">
        <div class="card-name">${esc(ch.display_name)}</div>
        <div class="card-badges">
          ${isActive?'<span class="badge badge-active">ON AIR</span>':''}
          ${isLive&&!isActive?'<span class="badge badge-live">LIVE</span>':''}
        </div>
      </div>
      ${timeStr?`<div style="font-size:.72rem;color:var(--muted);font-family:var(--mono);letter-spacing:.3px;">${esc(timeStr)}</div>`:''}
      <div class="card-footer">
        <button class="btn-listen ${isActive?'stop':'listen'}" id="btn-${esc(ch.id)}"
          onclick="toggleChannel(${JSON.stringify(ch.id)},${JSON.stringify(ch.display_name)})">
          ${isActive
            ?`<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>STOP`
            :`<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>LISTEN`}
        </button>
      </div>
    </div>`;
  }).join('');
}

function renderSchedule() {
  const list=document.getElementById('scheduleList');
  const sorted=[...channels].filter(ch=>ch.starts_at).sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));
  if(!sorted.length){list.innerHTML='<div class="schedule-day" style="margin-top:20px;text-align:center">No scheduled start times available.</div>';return;}
  const groups={};
  for(const ch of sorted){
    const key=new Date(ch.starts_at).toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'}).toUpperCase();
    (groups[key]||(groups[key]=[])).push(ch);
  }
  list.innerHTML=Object.entries(groups).map(([day,chs])=>`
    <div class="schedule-day">${day}</div>
    ${chs.map(ch=>`<div class="schedule-row">
      <div class="schedule-time">${new Date(ch.starts_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
      <div class="schedule-name">${esc(ch.display_name)}</div>
    </div>`).join('')}
  `).join('');
}

// ─── Player bar ───────────────────────────────────────────────────────────────
function updatePlayer() {
  const bar=document.getElementById('playerBar');
  const rows=document.getElementById('playerRows');
  const count=document.getElementById('playerCount');
  const pill=document.getElementById('livePill');

  if(activeSessions.size===0){bar.classList.remove('show');pill.classList.remove('show');return;}

  bar.classList.add('show');
  pill.classList.add('show');
  count.textContent=`${activeSessions.size} channel${activeSessions.size>1?'s':''}`;

  const allM=[...activeSessions.values()].every(s=>s.muted);
  document.getElementById('muteAllBtn').textContent=allM?'Unmute all':'Mute all';

  rows.innerHTML=[...activeSessions.entries()].map(([id,sess])=>{
    const vol=Math.round((sess.volume??1)*100);
    return `<div class="player-row" id="prow-${esc(id)}">
      <button class="mute-btn ${sess.muted?'muted':''}" onclick="toggleMute(${JSON.stringify(id)})">
        ${sess.muted?'Unmute':'Mute'}
      </button>
      <div class="player-info">
        <div class="player-name">${esc(sess.name)}</div>
      </div>
      <div class="vol-wrap">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <input type="range" class="vol" min="0" max="100" value="${vol}"
          oninput="setVolume(${JSON.stringify(id)},this.value)">
      </div>
      <button class="stop-btn" onclick="stopChannel(${JSON.stringify(id)})" title="Stop">
        <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
      </button>
    </div>`;
  }).join('');
}

function togglePlayer() {
  playerCollapsed=!playerCollapsed;
  document.getElementById('playerRows').style.display=playerCollapsed?'none':'';
  document.getElementById('playerHeader').classList.toggle('collapsed',playerCollapsed);
}

function toggleMute(channelId) {
  const sess=activeSessions.get(channelId);
  if(!sess) return;
  sess.muted=!sess.muted;
  if(sess.gain) sess.gain.gain.value = sess.muted ? 0 : (sess.volume ?? 1);
  updatePlayer();
}

function muteAll() {
  const anyUnmuted=[...activeSessions.values()].some(s=>!s.muted);
  activeSessions.forEach((sess)=>{
    sess.muted=anyUnmuted;
    if(sess.gain) sess.gain.gain.value = anyUnmuted ? 0 : (sess.volume ?? 1);
  });
  updatePlayer();
}

function setVolume(channelId, val) {
  const sess=activeSessions.get(channelId);
  if(!sess) return;
  sess.volume=val/100;
  if(sess.gain && !sess.muted) sess.gain.gain.value = sess.volume;
}

function popOut() {
  const w=window.open('','_blank','width=480,height=320');
  if(!w) return;
  const rows=[...activeSessions.values()].map(s=>`
    <div style="display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #2a2a30">
      <span style="min-width:120px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.name)}</span>
    </div>`).join('');
  w.document.write(`<!DOCTYPE html><html><head><title>Player</title>
  <style>body{margin:0;background:#0e0e0f;color:#e4e4e7;font-family:sans-serif;}
  h3{padding:14px 16px;margin:0;border-bottom:1px solid #2a2a30;font-size:14px;}</style>
  </head><body><h3>🎙 ${activeSessions.size} channel${activeSessions.size>1?'s':''} playing</h3>${rows}</body></html>`);
}

// ─── Session control (LiveKit browser SDK) ────────────────────────────────────
async function toggleChannel(id,name){activeSessions.has(id)?await stopChannel(id):await startChannel(id,name);}

function _cleanupSession(channelId) {
  const sess = activeSessions.get(channelId);
  if (!sess) return;
  sess._elements.forEach(el => { try { el.remove(); } catch(_){} });
  try { sess.audioCtx.close(); } catch(_){}
  activeSessions.delete(channelId);
  renderChannels(); updatePlayer();
}

async function startChannel(channelId, channelName) {
  if(activeSessions.has(channelId)) return;
  const btn=document.getElementById('btn-'+channelId);
  if(btn){btn.disabled=true;btn.innerHTML='…';}

  try {
    // Get LiveKit token + URL from our server
    const res = await fetch(`${API}/api/session`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${authToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ channelId })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Failed to get session');

    const { token, url } = data;

    // Web Audio for volume/mute control
    const audioCtx = new AudioContext();
    const gainNode = audioCtx.createGain();
    gainNode.connect(audioCtx.destination);

    // Create LiveKit room
    const room = new LivekitClient.Room();

    const sess = {
      room, audioCtx, gain: gainNode,
      muted: false, volume: 1,
      name: channelName,
      _elements: [],
      _stopping: false,
    };
    activeSessions.set(channelId, sess);
    renderChannels(); updatePlayer();

    // Wire up audio track handler before connecting
    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
      if (track.kind !== LivekitClient.Track.Kind.Audio) return;
      const s = activeSessions.get(channelId);
      if (!s) return;

      const el = track.attach();
      // We route audio through Web Audio API for volume control, so mute the element itself
      el.muted = true;
      el.style.display = 'none';
      document.body.appendChild(el);
      s._elements.push(el);

      try {
        const src = s.audioCtx.createMediaElementSource(el);
        src.connect(s.gain);
        // Unmute the element now that it's piped through the gain node
        el.muted = false;
      } catch(e) {
        console.error('Web Audio routing error:', e);
        // Fallback: just play directly
        el.muted = false;
      }
    });

    room.on(LivekitClient.RoomEvent.Disconnected, () => {
      const s = activeSessions.get(channelId);
      if (s && !s._stopping) {
        showToast(`Disconnected from ${channelName}`, 'error');
        _cleanupSession(channelId);
      }
    });

    await room.connect(url, token);

    // Resume AudioContext — browsers require a user gesture; connect() is triggered by click so this should work
    if (audioCtx.state === 'suspended') await audioCtx.resume();

    showToast(`Listening: ${channelName}`, 'success');
    if(btn){btn.disabled=false;}

  } catch(e) {
    showToast(e.message || 'Connection failed', 'error');
    _cleanupSession(channelId);
    if(btn){btn.disabled=false;}
  }
}

async function stopChannel(channelId) {
  const sess = activeSessions.get(channelId);
  if (!sess) return;
  sess._stopping = true;
  try { sess.room.disconnect(); } catch(_){}
  _cleanupSession(channelId);
}

// ─── Change password modal ────────────────────────────────────────────────────
function openChangePassword() {
  document.getElementById('cpModal').classList.add('show');
  document.getElementById('cpMsg').textContent='';
  document.getElementById('cpMsg').className='modal-msg';
  ['cpCurrent','cpNew','cpConfirm'].forEach(id=>document.getElementById(id).value='');
}
function closeModal() {
  document.getElementById('cpModal').classList.remove('show');
}
async function changePassword() {
  const cur=document.getElementById('cpCurrent').value;
  const nw=document.getElementById('cpNew').value;
  const cf=document.getElementById('cpConfirm').value;
  const msg=document.getElementById('cpMsg');
  msg.textContent=''; msg.className='modal-msg';
  if(!cur||!nw||!cf){msg.textContent='All fields required.';msg.classList.add('err');return;}
  if(nw!==cf){msg.textContent='New passwords do not match.';msg.classList.add('err');return;}
  if(nw.length<6){msg.textContent='Password must be at least 6 characters.';msg.classList.add('err');return;}
  try {
    const res=await fetch(`${API}/auth/change-password`,{
      method:'POST',headers:{'Authorization':`Bearer ${authToken}`,'Content-Type':'application/json'},
      body:JSON.stringify({currentPassword:cur,newPassword:nw})
    });
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||'Failed');
    msg.textContent='Password changed! Please sign in again.';msg.classList.add('ok');
    setTimeout(signOut,1800);
  } catch(e){msg.textContent=e.message;msg.classList.add('err');}
}
</script>
</body>
</html>
